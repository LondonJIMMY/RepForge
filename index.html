<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RepForge" />
  <meta name="description" content="A private, installable workout planner and training log." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <title>RepForge</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="RepForge home">
        <span class="brand-mark">RF</span>
        <div><strong>RepForge</strong><small id="save-status">Saved on this device</small></div>
      </div>
      <button class="icon-button" id="theme-toggle" aria-label="Toggle theme">◐</button>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-view="today" class="active"><span>⌂</span>Today</button>
      <button data-view="workouts"><span>▤</span>Workouts</button>
      <button data-view="exercises"><span>◉</span>Exercises</button>
      <button data-view="progress"><span>↗</span>Progress</button>
      <button data-view="settings"><span>⚙</span>Settings</button>
    </nav>
  </div>

  <section id="workout-screen" class="workout-screen hidden" aria-live="polite"></section>
  <section id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json" hidden />
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
